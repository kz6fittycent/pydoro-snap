name: pydoro
adopt-info: pydoro
summary: Terminal Pomodoro Timer
description: |
  Terminal Pomodoro Timer

license: MIT

base: core24
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  pydoro:
    command: bin/pydoro
    command-chain:
      - bin/homeishome-launch
    environment:
      LC_ALL: C.UTF-8
      # pydoro plays its alarm with GStreamer through PyGObject (gi), staged from noble
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
      GI_TYPELIB_PATH: $SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/girepository-1.0
      GST_PLUGIN_SYSTEM_PATH: $SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gstreamer-1.0
      GST_PLUGIN_SCANNER: $SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner
      LD_LIBRARY_PATH: $SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pulseaudio
    plugs:
      - home
      - audio-playback
      - alsa
      - pulseaudio

parts:
  pydoro:
    source: https://github.com/JaDogg/pydoro
    source-type: git
    plugin: python
    stage-packages:
      - python3-gi
      - gir1.2-gstreamer-1.0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pulseaudio
      - libpulse0
    override-build: |
      # setup.py finds its own dir with getsource(lambda: 0), which fails under
      # modern pip (setup.py isn't run from a file); use __file__ instead.
      sed -i 's|here = abspath(dirname(getsource(lambda: 0)))|here = abspath(dirname(__file__))|' setup.py
      craftctl default
    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags | sed 's/^v//' | cut -d "-" -f1)"

  homeishome-launch:
    plugin: nil
    stage-snaps:
      - homeishome-launch
